name: Deploy to GitHub Pages

on:
  push:
    branches: "main" # Hoặc master tùy theo tên nhánh của bạn

# Cấp quyền cho GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # Sửa thành ./build nếu bạn dùng Create React App cũ

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
